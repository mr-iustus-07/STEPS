name: steps
description: "STEPS - Personal growth and discipline manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  path_provider: ^2.1.5

  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2

  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo_dark.png
    - assets/logo_light.png
flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
  image_path: "assets/logo_light.png"